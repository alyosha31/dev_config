# Open a visible path:line reference in Neovim in a new Kitty tab.
# Press Ctrl-G, then type the hint label shown over the desired reference.
map ctrl+g kitten hints --customize-processing /Users/mg/dev_config/kitty/code-hints.py

# Open new tabs in the last directory reported by the shell. Unlike
# new_tab_with_cwd, this does not pick up an internal cwd from editor tooling.
map ctrl+shift+t launch --type=tab --cwd=last_reported
map cmd+t launch --type=tab --cwd=last_reported

# Keep the tab bar above the terminal content.
tab_bar_edge top

# Open links with Cmd-click, including inside terminal apps that grab the mouse.
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event

# Browse terminal history with real Neovim motions.
# Open it with Ctrl-Shift-H.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
scrollback_pager_history_size 64

# Enables prompt-aware navigation and preserves each command's working directory.
shell_integration enabled

# Show the custom welcome card whenever Kitty starts an interactive shell.
env KITTY_SI_RUN_COMMAND_AT_STARTUP=/Users/mg/dev_config/kitty/welcome

# Keep the normal terminal editor consistent with the reference opener.
editor nvim

# GUI apps launched from Finder/Dock do not inherit Homebrew's shell PATH.
# This environment is inherited by Kitty shells and programs launched by hints.
env PATH=/Users/mg/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
env EDITOR=nvim
env VISUAL=nvim

# Do not let a parent tool's accessibility setting disable colors in Kitty.
env NO_COLOR


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# A compact Kanagawa tab bar with a clear active tab and softer inactive tabs.
tab_bar_style powerline
tab_powerline_style round
tab_bar_background #1F1F28
tab_bar_margin_width 1.0
active_tab_foreground #1F1F28
active_tab_background #E5C283
inactive_tab_foreground #A8A48D
inactive_tab_background #363644
tab_title_template " {index}: {title} "
active_tab_title_template "{fmt.bold} {index}: {title} "
tab_title_max_length 30

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
