# Catppuccin Mocha, to match Kitty/Ghostty and Neovim. Both speak truecolor; tell
# tmux so the hex colours below, and Neovim's, pass through unrounded.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',xterm-ghostty:RGB'

set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left '#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#89b4fa]%H:%M '
# Agent flags set by bin/agent-tmux-flag: yellow ? when Claude/Codex is waiting
# on you, green ✓ when it finished. Cleared when you switch to the window.
set -g window-status-format '#[fg=#6c7086] #I:#W#{?#{==:#{@agent},?},#[fg=#f9e2af#,bold] ?,}#{?#{==:#{@agent},✓},#[fg=#a6e3a1#,bold] ✓,} '
set-hook -g session-window-changed 'set-option -w -u @agent'

# Title each terminal tab with its session name, so bin/agent-focus can find
# the Kitty or Ghostty tab showing a session.
set -g set-titles on
set -g set-titles-string '#S'
set -g window-status-current-format '#[bg=#313244,fg=#cba6f7,bold] #I:#W '
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'
