# Catppuccin Mocha, to match Kitty/Ghostty and Neovim. Both speak truecolor; tell
# tmux so the hex colours below, and Neovim's, pass through unrounded.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',xterm-ghostty:RGB'

set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left '#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#89b4fa]%H:%M '
# Agent flags set by bin/agent-tmux-flag in @agent: "wait" when Claude/Codex
# is waiting on you, "done" when it finished. A flagged window's whole entry
# gets a yellow (wait, ?) or green (done, ✓) background so it stands out from
# the grey ones. Cleared when you switch to the window.
set -g window-status-format '#{?#{==:#{@agent},wait},#[bg=#f9e2af#,fg=#1e1e2e#,bold] #I:#W ? ,#{?#{==:#{@agent},done},#[bg=#a6e3a1#,fg=#1e1e2e#,bold] #I:#W ✓ ,#[fg=#6c7086] #I:#W }}'
set-hook -g session-window-changed 'set-option -w -u @agent'
# Coming back to a terminal tab is not a window change in tmux, so also
# clear the mark on the window that is current when the tab gains focus.
# The terminal reports focus only with focus-events on.
set -g focus-events on
set-hook -g client-focus-in 'set-option -w -u @agent'

# Title each terminal tab with its session name, so bin/agent-focus can find
# the Kitty or Ghostty tab showing a session. Neither terminal can colour a
# tab, so a coloured emoji in front marks a session with a flagged window:
# 🟡 when an agent waits on you, else 🟢 when one finished. It stays until
# you visit the window, after the notification is gone.
set -g set-titles on
set -g set-titles-string '#{?#{m:*wait*,#{W:#{@agent}}},🟡 ,#{?#{m:*done*,#{W:#{@agent}}},🟢 ,}}#S'
set -g window-status-current-format '#[bg=#313244,fg=#cba6f7,bold] #I:#W '
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'
