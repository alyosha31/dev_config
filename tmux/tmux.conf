set -g status-interval 1

bind-key p run-shell -b 'pomo start 40 >/dev/null 2>&1'
bind-key T command-prompt -p 'Pomodoro minutes:' -I '40' "run-shell -b 'pomo start %1 >/dev/null 2>&1'"
bind-key P run-shell -b 'pomo toggle >/dev/null 2>&1'
bind-key X run-shell -b 'pomo stop >/dev/null 2>&1'

# Catppuccin Mocha, to match Kitty and Neovim. Kitty speaks truecolor; tell
# tmux so the hex colours below, and Neovim's, pass through unrounded.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'

set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left '#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#f9e2af]#(pomo status --short) #[fg=#6c7086]| #[fg=#89b4fa]%H:%M '
set -g window-status-format '#[fg=#6c7086] #I:#W '
set -g window-status-current-format '#[bg=#313244,fg=#cba6f7,bold] #I:#W '
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'
